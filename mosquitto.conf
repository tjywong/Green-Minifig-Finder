# Mosquitto MQTT server for Green Minifig Finder.
# Run with:  /opt/homebrew/opt/mosquitto/sbin/mosquitto -c mosquitto.conf

# Accept connections from any device on the network, no password required.
# Anyone who can reach this computer can read the positions and send fake ones
# (which would move the car).
listener 1883 0.0.0.0
allow_anonymous true

# Log to the terminal
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
